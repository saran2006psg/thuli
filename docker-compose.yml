services:
  # Run once after downloading the external data archive.
  setup:
    build:
      context: .
    image: thuli-cpu:latest
    environment:
      MODEL_CACHE_DIR: /app/.cache
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - thuli-model-cache:/app/.cache
    command: ["python", "scripts/setup.py"]

  app:
    build:
      context: .
    image: thuli-cpu:latest
    environment:
      MODEL_CACHE_DIR: /app/.cache
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - thuli-model-cache:/app/.cache
    restart: unless-stopped

volumes:
  thuli-model-cache:
